name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release tag (for example, v2.0.0-rc.1)"
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

env:
  GO_VERSION: "1.26.5"
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  prepare-release:
    name: Validate Tag & Prepare Notes
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      image_tag: ${{ steps.release.outputs.image_tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      build_date: ${{ steps.release.outputs.build_date }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}
      - name: Validate release identity
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then TAG="${REQUESTED_TAG}"; else TAG="${GITHUB_REF#refs/tags/}"; fi
          SEMVER='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'
          [[ "${TAG}" =~ ${SEMVER} ]] || { echo "::error::Release tag '${TAG}' is not valid SemVer with a v prefix."; exit 1; }
          git rev-parse --verify "refs/tags/${TAG}" >/dev/null
          TAG_COMMIT="$(git rev-list -n 1 "${TAG}")"
          HEAD_COMMIT="$(git rev-parse HEAD)"
          [[ "${TAG_COMMIT}" == "${HEAD_COMMIT}" ]] || { echo "::error::Checked-out commit ${HEAD_COMMIT} does not match tag ${TAG} at ${TAG_COMMIT}."; exit 1; }
          if [[ "${GITHUB_EVENT_NAME}" == push ]]; then [[ "${TAG_COMMIT}" == "${GITHUB_SHA}" ]] || { echo "::error::Tag ${TAG} does not match event commit ${GITHUB_SHA}."; exit 1; }; fi
          VERSION="${TAG#v}"
          IMAGE_TAG="${VERSION//+/-}"
          BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          PRERELEASE=false; [[ "${VERSION}" == *-* ]] && PRERELEASE=true
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "image_tag=${IMAGE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${PRERELEASE}" >> "${GITHUB_OUTPUT}"
          echo "build_date=${BUILD_DATE}" >> "${GITHUB_OUTPUT}"
          echo "commit=${TAG_COMMIT}" >> "${GITHUB_OUTPUT}"
      - name: Generate release notes
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if [[ -z "${PREVIOUS_TAG}" ]]; then
            printf '## Initial release\n' > CHANGELOG.md
          else
            { printf "## What's Changed in %s\n\n" "${TAG}"; git log "${PREVIOUS_TAG}..HEAD" --pretty=format:'- %s (%h)' --reverse; printf '\n\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' "${GITHUB_REPOSITORY}" "${PREVIOUS_TAG}" "${TAG}"; } > CHANGELOG.md
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: CHANGELOG.md
          if-no-files-found: error

  create-draft:
    name: Create Draft Release
    runs-on: ubuntu-latest
    needs:
      [
        prepare-release,
        verify-release-binaries,
        verify-windows-installer,
        verify-staging-image,
        container-vulnerability-scan,
        generate-sbom,
      ]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          name: Release ${{ needs.prepare-release.outputs.tag }}
          body_path: CHANGELOG.md
          draft: true
          prerelease: ${{ needs.prepare-release.outputs.prerelease == 'true' }}

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: [prepare-release]
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.prepare-release.outputs.commit }}" }
      - uses: actions/setup-go@v5
        with: { go-version: "${{ env.GO_VERSION }}", cache: true }
      - run: make check-linter
      - run: make ci-lint
      - name: Verify formatting and modules
        run: make format && git diff --exit-code

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [prepare-release]
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.prepare-release.outputs.commit }}" }
      - uses: actions/setup-go@v5
        with: { go-version: "${{ env.GO_VERSION }}", cache: true }
      - run: make ci-test

  sqlite-tests:
    name: SQLite Tests
    runs-on: ubuntu-latest
    needs: [prepare-release]
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.prepare-release.outputs.commit }}" }
      - uses: actions/setup-go@v5
        with: { go-version: "${{ env.GO_VERSION }}", cache: true }
      - run: make ci-test-sqlite

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [prepare-release]
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.prepare-release.outputs.commit }}" }
      - uses: actions/setup-go@v5
        with: { go-version: "${{ env.GO_VERSION }}", cache: true }
      - run: make ci-test-integration

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [prepare-release]
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.prepare-release.outputs.commit }}" }
      - uses: actions/setup-go@v5
        with: { go-version: "${{ env.GO_VERSION }}", cache: true }
      - run: make ci-test-e2e

  migration-tests:
    name: Migration Tests
    runs-on: ubuntu-latest
    needs: [prepare-release]
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.prepare-release.outputs.commit }}" }
      - uses: actions/setup-go@v5
        with: { go-version: "${{ env.GO_VERSION }}", cache: true }
      - run: make ci-test-migrations

  vulnerability-scan:
    name: Go Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [prepare-release]
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.prepare-release.outputs.commit }}" }
      - uses: actions/setup-go@v5
        with: { go-version: "${{ env.GO_VERSION }}", cache: true }
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...

  release-gates:
    name: Release Gates
    runs-on: ubuntu-latest
    if: always()
    needs:
      [
        code-quality,
        unit-tests,
        sqlite-tests,
        integration-tests,
        e2e-tests,
        migration-tests,
        vulnerability-scan,
      ]
    steps:
      - name: Require every release gate
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          if [[ "${RESULTS}" == *failure* || "${RESULTS}" == *cancelled* || "${RESULTS}" == *skipped* ]]; then echo "Release gates did not all succeed: ${RESULTS}"; exit 1; fi

  build-release-binaries:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: [prepare-release, release-gates]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: arm }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.prepare-release.outputs.commit }}" }
      - uses: actions/setup-go@v5
        with: { go-version: "${{ env.GO_VERSION }}", cache: true }
      - name: Build and inspect artifact
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          BUILD_DATE: ${{ needs.prepare-release.outputs.build_date }}
          COMMIT: ${{ needs.prepare-release.outputs.commit }}
          TARGET_OS: ${{ matrix.goos }}
          TARGET_ARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p dist
          BINARY_NAME="chronoqueue-${TAG}-${TARGET_OS}-${TARGET_ARCH}"; [[ "${TARGET_OS}" == windows ]] && BINARY_NAME="${BINARY_NAME}.exe"
          LDFLAGS="-s -w -X github.com/adrien19/chronoqueue/pkg/version.Version=${VERSION} -X github.com/adrien19/chronoqueue/pkg/version.GitCommit=${COMMIT} -X github.com/adrien19/chronoqueue/pkg/version.BuildDate=${BUILD_DATE}"
          GOOS="${TARGET_OS}" GOARCH="${TARGET_ARCH}" CGO_ENABLED=0 go build -trimpath -ldflags="${LDFLAGS}" -o "dist/${BINARY_NAME}" .
          strings "dist/${BINARY_NAME}" | grep -Fx -- "${VERSION}"
          strings "dist/${BINARY_NAME}" | grep -Fx -- "${COMMIT}"
          strings "dist/${BINARY_NAME}" | grep -Fx -- "${BUILD_DATE}"
          printf 'version=%s\ncommit=%s\nbuild_date=%s\n' "${TAG}" "${COMMIT}" "${BUILD_DATE}" > "dist/${BINARY_NAME}.release"
          if [[ "${TARGET_OS}" == windows ]]; then
            (cd dist && zip "${BINARY_NAME}.zip" "${BINARY_NAME}" "${BINARY_NAME}.release" && sha256sum "${BINARY_NAME}.zip" > "${BINARY_NAME}.zip.sha256")
          else
            tar -C dist -czf "dist/${BINARY_NAME}.tar.gz" "${BINARY_NAME}" "${BINARY_NAME}.release"
            (cd dist && sha256sum "${BINARY_NAME}.tar.gz" > "${BINARY_NAME}.tar.gz.sha256")
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

  build-staging-image:
    name: Build Staging Container
    runs-on: ubuntu-latest
    needs: [prepare-release, release-gates]
    outputs:
      staging_image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.prepare-release.outputs.commit }}" }
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          {
            registry: "${{ env.DOCKER_REGISTRY }}",
            username: "${{ github.actor }}",
            password: "${{ secrets.GITHUB_TOKEN }}",
          }
      - id: image
        run: echo "name=${DOCKER_REGISTRY}/${IMAGE_NAME}:release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./images/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.image.outputs.name }}
          provenance: true
          sbom: true
          build-args: |
            VERSION=${{ needs.prepare-release.outputs.version }}
            GIT_COMMIT=${{ needs.prepare-release.outputs.commit }}
            BUILD_DATE=${{ needs.prepare-release.outputs.build_date }}
          labels: |
            org.opencontainers.image.version=${{ needs.prepare-release.outputs.version }}
            org.opencontainers.image.revision=${{ needs.prepare-release.outputs.commit }}
            org.opencontainers.image.created=${{ needs.prepare-release.outputs.build_date }}

  verify-release-binaries:
    name: Verify Binaries & Unix Installer
    runs-on: ubuntu-latest
    needs: [prepare-release, build-release-binaries]
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.prepare-release.outputs.commit }}" }
      - uses: actions/download-artifact@v4
        with: { pattern: "release-*", path: artifacts, merge-multiple: true }
      - name: Verify every archive
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          BUILD_DATE: ${{ needs.prepare-release.outputs.build_date }}
          COMMIT: ${{ needs.prepare-release.outputs.commit }}
        run: |
          set -euo pipefail
          find artifacts -name '*.sha256' -print0 | while IFS= read -r -d '' checksum; do (cd "$(dirname "${checksum}")" && sha256sum -c "$(basename "${checksum}")"); done
          for archive in artifacts/*.tar.gz; do
            temp_dir="$(mktemp -d)"; tar -xzf "${archive}" -C "${temp_dir}"; metadata="$(find "${temp_dir}" -name '*.release' -type f -print -quit)"
            grep -Fx "version=${TAG}" "${metadata}"; grep -Fx "commit=${COMMIT}" "${metadata}"; grep -Fx "build_date=${BUILD_DATE}" "${metadata}"; rm -rf "${temp_dir}"
          done
          temp_dir="$(mktemp -d)"; tar -xzf "artifacts/chronoqueue-${TAG}-linux-amd64.tar.gz" -C "${temp_dir}"
          output="$("${temp_dir}/chronoqueue-${TAG}-linux-amd64" --version)"
          grep -Fq "ChronoQueue v${VERSION}" <<<"${output}"; grep -Fq "Git Commit: ${COMMIT}" <<<"${output}"; grep -Fq "Built:      ${BUILD_DATE}" <<<"${output}"
      - name: Exercise Unix installer against built release
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euo pipefail
          release_root="$(mktemp -d)"; install_dir="$(mktemp -d)"; mkdir -p "${release_root}/download/${TAG}"
          cp "artifacts/chronoqueue-${TAG}-linux-amd64.tar.gz"* "${release_root}/download/${TAG}/"
          CHRONOQUEUE_RELEASES_URL="file://${release_root}" CHRONOQUEUE_INSTALL_DIR="${install_dir}" bash install/install.sh "${VERSION}"
          "${install_dir}/chronoqueue" --version

  verify-staging-image:
    name: Verify Container
    runs-on: ubuntu-latest
    needs: [prepare-release, build-staging-image]
    steps:
      - uses: docker/login-action@v3
        with:
          {
            registry: "${{ env.DOCKER_REGISTRY }}",
            username: "${{ github.actor }}",
            password: "${{ secrets.GITHUB_TOKEN }}",
          }
      - name: Assert container metadata
        env:
          IMAGE: ${{ needs.build-staging-image.outputs.staging_image }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
          BUILD_DATE: ${{ needs.prepare-release.outputs.build_date }}
          COMMIT: ${{ needs.prepare-release.outputs.commit }}
        run: |
          set -euo pipefail
          docker pull "${IMAGE}"; output="$(docker run --rm "${IMAGE}" --version)"
          grep -Fq "ChronoQueue v${VERSION}" <<<"${output}"; grep -Fq "Git Commit: ${COMMIT}" <<<"${output}"; grep -Fq "Built:      ${BUILD_DATE}" <<<"${output}"

  container-vulnerability-scan:
    name: Container Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [build-staging-image]
    steps:
      - uses: aquasecurity/trivy-action@master
        with:
          {
            image-ref: "${{ needs.build-staging-image.outputs.staging_image }}",
            format: table,
            exit-code: "1",
            severity: "HIGH,CRITICAL",
            ignore-unfixed: true,
          }

  generate-sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: [prepare-release, build-staging-image]
    steps:
      - uses: anchore/sbom-action@v0
        with:
          image: ${{ needs.build-staging-image.outputs.staging_image }}
          format: spdx-json
          output-file: sbom-${{ needs.prepare-release.outputs.tag }}.spdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        with:
          {
            name: release-sbom,
            path: "sbom-${{ needs.prepare-release.outputs.tag }}.spdx.json",
            if-no-files-found: error,
          }

  verify-windows-installer:
    name: Verify Windows Installer
    runs-on: windows-latest
    needs: [prepare-release, build-release-binaries]
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.prepare-release.outputs.commit }}" }
      - uses: actions/download-artifact@v4
        with: { name: release-windows-amd64, path: artifacts }
      - name: Serve artifact and run installer
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          $releaseRoot = Join-Path $env:RUNNER_TEMP "chronoqueue-release"
          $downloadDir = Join-Path $releaseRoot "download/$env:TAG"
          $installDir = Join-Path $env:RUNNER_TEMP "chronoqueue-install"
          New-Item -ItemType Directory -Force -Path $downloadDir | Out-Null
          Copy-Item "artifacts/*" $downloadDir
          $server = Start-Process python -ArgumentList "-m", "http.server", "8765", "--directory", $releaseRoot -PassThru
          try {
            Start-Sleep -Seconds 1
            $env:CHRONOQUEUE_RELEASES_URL = "http://127.0.0.1:8765"
            & ./install/install.ps1 -Version $env:VERSION -InstallDir $installDir
            & (Join-Path $installDir "chronoqueue.exe") --version
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Stop-Process -Id $server.Id -Force }

  publish-release:
    name: Publish Verified Release
    runs-on: ubuntu-latest
    needs:
      [
        prepare-release,
        create-draft,
        build-staging-image,
        verify-release-binaries,
        verify-windows-installer,
        verify-staging-image,
        container-vulnerability-scan,
        generate-sbom,
      ]
    steps:
      - uses: actions/download-artifact@v4
        with:
          { pattern: "release-*", path: release-assets, merge-multiple: true }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          {
            registry: "${{ env.DOCKER_REGISTRY }}",
            username: "${{ github.actor }}",
            password: "${{ secrets.GITHUB_TOKEN }}",
          }
      - name: Promote tested container manifest
        env:
          STAGING_IMAGE: ${{ needs.build-staging-image.outputs.staging_image }}
          IMAGE_TAG: ${{ needs.prepare-release.outputs.image_tag }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
          PRERELEASE: ${{ needs.prepare-release.outputs.prerelease }}
        run: |
          set -euo pipefail
          IMAGE="${DOCKER_REGISTRY}/${IMAGE_NAME}"; docker buildx imagetools create --tag "${IMAGE}:${IMAGE_TAG}" "${STAGING_IMAGE}"
          if [[ "${PRERELEASE}" == false && "${VERSION}" != *+* ]]; then IFS=. read -r major minor patch <<<"${VERSION}"; docker buildx imagetools create --tag "${IMAGE}:${major}.${minor}" --tag "${IMAGE}:${major}" --tag "${IMAGE}:latest" "${STAGING_IMAGE}"; fi
      - name: Upload assets and publish draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          PRERELEASE: ${{ needs.prepare-release.outputs.prerelease }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release-assets -type f \( -name '*.tar.gz' -o -name '*.sha256' -o -name '*.zip' -o -name '*.spdx.json' \) -print)
          gh release upload "${TAG}" "${assets[@]}" --clobber
          if [[ "${PRERELEASE}" == true ]]; then gh release edit "${TAG}" --draft=false --prerelease; else gh release edit "${TAG}" --draft=false --prerelease=false; fi
      - name: Release summary
        env:
          TAG: ${{ needs.prepare-release.outputs.tag }}
          IMAGE_TAG: ${{ needs.prepare-release.outputs.image_tag }}
          PRERELEASE: ${{ needs.prepare-release.outputs.prerelease }}
        run: |
          echo "## Release ${TAG} published" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Container: \`${DOCKER_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}\`" >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${PRERELEASE}" == false ]]; then echo '- Stable aliases, including `latest`, were promoted.' >> "${GITHUB_STEP_SUMMARY}"; else echo '- Prerelease: stable aliases and `latest` were not changed.' >> "${GITHUB_STEP_SUMMARY}"; fi
