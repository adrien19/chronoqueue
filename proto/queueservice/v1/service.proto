// ChronoQueue Service API v1
//
// This file defines the complete gRPC service interface for ChronoQueue.
// All client operations go through this service.
//
// Service categories:
// 1. Queue Management: Create, delete, list, get state
// 2. Message Operations: Post, get, acknowledge, renew lease, peek, heartbeat
// 3. Schedule Management: Create, delete, get, list, pause, resume, history
// 4. Dead Letter Queue: Get messages, requeue, delete, purge, stats
// 5. Calendar Schedules: Validate, preview
// 6. Schema Management: Register, get, list, delete, validate payloads
//
// All RPCs support both gRPC and REST (via gRPC-Gateway annotations).
// REST endpoints follow Google API Design Guide conventions.

syntax = "proto3";
package chronoqueue.api.queueservice.v1;

option go_package = "github.com/adrien19/chronoqueue/api/queueservice/v1;queueservice";

import "proto/google/api/annotations.proto";
// import "proto/google/api/field_behavior.proto";
import "proto/queueservice/v1/request_response.proto";

// QueueService is the primary API for interacting with ChronoQueue.
//
// This service provides:
// - Queue lifecycle management
// - Message posting and consumption
// - Scheduled task automation
// - Dead letter queue handling
// - Schema-based validation
//
// Example - Basic message flow:
//   1. CreateQueue: Set up a queue with retry/DLQ configuration
//   2. PostMessage: Add messages to the queue
//   3. GetNextMessage: Workers retrieve messages for processing
//   4. AcknowledgeMessage: Mark message as successfully processed
//      OR let lease expire → message returns to queue for retry
//   5. After max_attempts exhausted → message moves to DLQ
//
// gRPC vs REST:
// - gRPC: Preferred for high-throughput, low-latency scenarios
// - REST: Convenient for browser/curl access, debugging, simple integrations
//
// Error handling:
// - Use gRPC status codes (InvalidArgument, NotFound, AlreadyExists, etc.)
// - Error details in status.Details() for validation errors
service QueueService {
    // ==================== Queue Management Operations ====================

    // CreateQueue creates a new queue with specified configuration.
    //
    // Use to:
    // - Define retry behavior (max_attempts, lease_duration)
    // - Set up dead letter queue for failed messages
    // - Configure priority handling
    // - Enforce message schemas
    //
    // Example:
    //   POST /v1/queues
    //   {
    //     "name": "order-processing",
    //     "metadata": {
    //       "default_max_attempts": 3,
    //       "lease_duration": "300s",
    //       "auto_create_dlq": true
    //     }
    //   }
    //
    // Returns: success status
    // Errors:
    //   - AlreadyExists: Queue with this name exists
    //   - InvalidArgument: Invalid configuration (negative lease_duration, etc.)
  rpc CreateQueue(CreateQueueRequest) returns (CreateQueueResponse) {
    option (google.api.http) = {
      post: "/v1/queues"
      body: "*"
    };
  }

    // DeleteQueue permanently deletes a queue and all its messages.
    //
    // WARNING: This operation is irreversible. All pending and running messages are lost.
    //
    // Use when:
    // - Decommissioning a feature
    // - Cleaning up test queues
    // - Removing unused queues
    //
    // Best practice: Drain queue first (stop posting, wait for workers to finish).
    //
    // Example:
    //   DELETE /v1/queues/order-processing
    //
    // Returns: success status
    // Errors:
    //   - NotFound: Queue doesn't exist
  rpc DeleteQueue(DeleteQueueRequest) returns (DeleteQueueResponse) {
    option (google.api.http) = {
      delete: "/v1/queues/{name=*}"
    };
  }

    // ListQueues returns all queues in your ChronoQueue instance.
    //
    // Use for:
    // - Monitoring dashboards
    // - Queue discovery
    // - Debugging
    //
    // Example:
    //   GET /v1/queues
    //
    // Returns: List of Queue objects with metadata
  rpc ListQueues(ListQueuesRequest) returns (ListQueuesResponse) {
    option (google.api.http) = {
      get: "/v1/queues"
    };
  }

    // GetQueueState returns current queue statistics and health.
    //
    // Provides:
    // - Message counts by state (INVISIBLE, PENDING, RUNNING, COMPLETED, CANCELED, ERRORED)
    // - Earliest active lease or heartbeat deadline
    //
    // Use for:
    // - Health checks
    // - Autoscaling decisions (scale workers based on PENDING count)
    // - Alerting (high ERRORED count, DLQ growth)
    //
    // Example:
    //   GET /v1/queues/order-processing/state
    //   Response:
    //   {
    //     "stateCounts": {"INVISIBLE": "0", "PENDING": "150", "RUNNING": "10", "COMPLETED": "5420", "CANCELED": "0", "ERRORED": "3"}
    //   }
    //
    // Returns: state counts and the earliest active deadline
  rpc GetQueueState(GetQueueStateRequest) returns (GetQueueStateResponse) {
    option (google.api.http) = {
      get: "/v1/queues/{queue_name=*}/state"
    };
  }

    // ==================== Message Operations ====================

    // PostMessage adds a new message to a queue.
    //
    // Use for:
    // - Asynchronous task execution
    // - Event-driven workflows
    // - Job scheduling
    // - Load leveling
    //
    // Features:
    // - Delayed execution (scheduled_time)
    // - Priority ordering
    // - Schema validation
    // - Deduplication by message_id within the queue
    // - Exclusive processing (exclusivity_key)
    //
    // Example - immediate execution:
    //   POST /v1/queues/order-processing/messages
    //   {
    //     "message": {
    //       "messageId": "order-123",
    //       "metadata": {
    //         "payload": {"data": "..."},
    //         "priority": 4
    //       }
    //     }
    //   }
    //
    // Example - delayed execution (send email in 1 hour):
    //   {
    //     "message": {
    //       "messageId": "email-123",
    //       "metadata": {
    //         "payload": {"data": "..."},
    //         "scheduledTime": "2024-12-01T15:00:00Z"
    //       }
    //     }
    //   }
    //
    // The caller must provide messageId. Returns success status.
    // Errors:
    //   - NotFound: Queue doesn't exist
    //   - InvalidArgument: Schema validation failed, invalid scheduled_time
    //   - AlreadyExists: Duplicate message_id in the queue
  rpc PostMessage(PostMessageRequest) returns (PostMessageResponse) {
    option (google.api.http) = {
      post: "/v1/queues/{queue_name=*}/messages"
      body: "message"
    };
  }

    // PostMessagesBulk posts multiple messages to a queue in a single operation.
    //
    // Supports two transaction modes:
    //   - ALL_OR_NOTHING: All messages succeed or all fail (atomic)
    //   - BEST_EFFORT: Independent processing, partial success allowed
    //
    // Limits:
    //   - Max 1000 messages per request
    //   - Max 1MB total payload size
    //
    // Errors:
    //   - NotFound: Queue doesn't exist
    //   - InvalidArgument: Too many messages, payload too large, invalid mode
    //   - FailedPrecondition: One or more messages failed in ALL_OR_NOTHING mode (entire batch rejected)
    //
    // Individual message errors are returned in the response with per-message error codes.
  rpc PostMessagesBulk(PostMessagesBulkRequest) returns (PostMessagesBulkResponse) {
    option (google.api.http) = {
      post: "/v1/queues/{queue_name=*}/messages:bulk"
      body: "*"
    };
  }

    // GetNextMessage retrieves the next available message for processing.
    //
    // This is the primary worker API. Call in a loop to continuously process messages.
    //
    // Behavior:
    // - Returns highest priority PENDING message
    // - Message moves to RUNNING state
    // - Lease timer starts (worker has lease_duration to process)
    // - If lease expires without ACK → message returns to PENDING for retry
    //
    // Concurrency:
    // - Multiple workers can call simultaneously
    // - Each worker gets a different message (no duplicates)
    // - EXCLUSIVE queues require their configured exclusivity_key and allow one
    //   RUNNING message until it is acknowledged, failed, or reclaimed
    //
    // Example worker loop:
    //   for {
    //       resp := client.GetNextMessage(ctx, &GetNextMessageRequest{
    //           QueueName: "order-processing",
    //           LeaseDuration: durationpb.New(5 * time.Minute),
    //       })
    //       if resp.Message == nil {
    //           time.Sleep(1 * time.Second)  // No messages available
    //           continue
    //       }
    //
    //       err := processMessage(resp.Message)
    //       if err != nil {
    //           // Let lease expire → automatic retry
    //           continue
    //       }
    //
    //       client.AcknowledgeMessage(ctx, &AcknowledgeMessageRequest{
    //           QueueName: "order-processing",
    //           MessageId: resp.Message.MessageId,
    //       })
    //   }
    //
    // Returns: Message (or empty if no messages available)
    // Errors:
    //   - NotFound: Queue doesn't exist
  rpc GetNextMessage(GetNextMessageRequest) returns (GetNextMessageResponse) {
    option (google.api.http) = {
      post: "/v1/queues/{queue_name=*}/messages:getNext"
      body: "*"
    };
  }

    // AcknowledgeMessage marks a message as successfully processed.
    //
    // Call this after successfully processing a message retrieved by GetNextMessage.
    //
    // Effects:
    // - Message moves to COMPLETED state
    // - Message retained or removed according to the queue retention policy
    // - Queue stats updated
    //
    // Important: attempt_id and worker_id from GetNextMessage are required and
    // must identify the active, unexpired lease.
    //
    // Example:
    //   POST /v1/queues/order-processing/messages/msg-123:acknowledge
    //
    // Returns: success status
    // Errors:
    //   - NotFound: Message doesn't exist or already acknowledged
    //   - DeadlineExceeded: Lease already expired
  rpc AcknowledgeMessage(AcknowledgeMessageRequest) returns (AcknowledgeMessageResponse) {
    option (google.api.http) = {
      post: "/v1/queues/{queue_name=*}/messages/{message_id=*}:acknowledge"
      body: "*"
    };
  }

    // CancelMessage cancels a pending message before it has been processed.
    //
    // Use when:
    // - Business logic invalidates the need for a message (order cancelled, user unsubscribed)
    // - Scheduled messages no longer needed (event rescheduled, task no longer relevant)
    // - Cleanup operations (purge old scheduled notifications)
    //
    // Producer-side operation: Only messages in INVISIBLE or PENDING state can be cancelled.
    // Messages already being processed (RUNNING) cannot be cancelled - use application-level
    // cancellation logic instead.
    //
    // Effects:
    // - Message moves to CANCELED state
    // - Message removed from processing queue
    // - Message retained based on retention policy (soft delete)
    // - Queue stats updated
    //
    // Example - cancel scheduled reminder:
    //   POST /v1/queues/notifications/messages/reminder-456:cancel
    //
    // Example - cancel all pending messages for a user:
    //   foreach messageId in userMessages:
    //       CancelMessage(queueName, messageId)
    //
    // Returns: success status
    // Errors:
    //   - NotFound: Message doesn't exist
    //   - FailedPrecondition: Message is RUNNING, COMPLETED, ERRORED, or already CANCELED
  rpc CancelMessage(CancelMessageRequest) returns (CancelMessageResponse) {
    option (google.api.http) = {
      post: "/v1/queues/{queue_name=*}/messages/{message_id=*}:cancel"
      body: "*"
    };
  }

    // RenewMessageLease extends the processing time for a message.
    //
    // Use when:
    // - Processing takes longer than expected
    // - Long-running batch operations
    // - External API calls with unpredictable latency
    //
    // Call periodically during processing to prevent lease expiration.
    // attempt_id and worker_id from GetNextMessage are required and must identify
    // the active, unexpired lease.
    // An omitted lease_duration uses the queue/message extend_step. Renewal fails
    // without consuming a renewal when no positive extension remains.
    //
    // Example pattern (heartbeat-style lease renewal):
    //   msg := getNextMessage()
    //   done := make(chan bool)
    //
    //   go func() {
    //       ticker := time.NewTicker(leaseDuration / 2)
    //       defer ticker.Stop()
    //       for {
    //           select {
    //           case <-ticker.C:
    //               renewMessageLease(msg.MessageId)
    //           case <-done:
    //               return
    //           }
    //       }
    //   }()
    //
    //   processMessage(msg)
    //   close(done)
    //   acknowledgeMessage(msg.MessageId)
    //
    // Returns: remaining lease time and current state
    // Errors:
    //   - NotFound: Message doesn't exist or already completed
    //   - FailedPrecondition: Message not in RUNNING state
  rpc RenewMessageLease(RenewMessageLeaseRequest) returns (RenewMessageLeaseResponse) {
    option (google.api.http) = {
      post: "/v1/queues/{queue_name=*}/messages/{message_id=*}:renewLease"
      body: "*"
    };
  }

    // PeekQueueMessages views messages without leasing them.
    //
    // Use for:
    // - Debugging (inspect message payloads)
    // - Monitoring (see what's pending)
    // - Admin dashboards
    //
    // Does NOT:
    // - Change message state
    // - Create leases
    // - Affect message ordering
    //
    // Example:
    //   GET /v1/queues/order-processing/messages:peek?page_size=10
    //
    // Returns: One deterministically ordered page of pending messages.
  rpc PeekQueueMessages(PeekQueueMessagesRequest) returns (PeekQueueMessagesResponse) {
    option (google.api.http) = {
      get: "/v1/queues/{queue_name=*}/messages:peek"
    };
  }

    // SendMessageHeartBeat indicates a worker is still processing a message.
    //
    // Alternative to RenewMessageLease that records worker liveness and extends
    // the lease to the configured heartbeat timeout.
    // attempt_id and worker_id from GetNextMessage are required and must identify
    // the active, unexpired lease.
    //
    // Example:
    //   POST /v1/queues/order-processing/messages:heartbeat
    //   {
    //     "messageId": "msg-123",
    //     "attemptId": "attempt-123",
    //     "workerId": "worker-1"
    //   }
    //
    // Returns: remaining lease time and current state
  rpc SendMessageHeartBeat(SendMessageHeartBeatRequest) returns (SendMessageHeartBeatResponse) {
    option (google.api.http) = {
      post: "/v1/queues/{queue_name=*}/messages:heartbeat"
      body: "*"
    };
  }

    // ==================== Schedule Management Operations ====================

    // CreateSchedule creates a recurring message posting schedule.
    //
    // Use for:
    // - Cron-style job scheduling (daily reports, hourly cleanup)
    // - Business calendar scheduling (first business day of month)
    // - Recurring notifications (reminders, alerts)
    // - Periodic batch processing
    //
    // Supports:
    // - Simple cron expressions: "0 9 * * 1-5" (weekdays at 9 AM)
    // - Complex calendar rules: "last Friday of each quarter"
    // - Timezone-aware scheduling
    // - Holiday handling
    //
    // Example - daily report at 8 AM EST:
    //   POST /v1/schedules
    //   {
    //     "schedule": {
    //       "schedule_id": "daily-sales-report",
    //       "metadata": {
    //         "cron_schedule": "0 8 * * *",
    //         "timezone": "America/New_York",
    //         "queue_name": "reports",
    //         "payload": {...}
    //       }
    //     }
    //   }
    //
    // Returns: success status
    // Errors:
    //   - AlreadyExists: schedule_id already in use
    //   - InvalidArgument: Invalid cron expression or calendar rule
  rpc CreateSchedule(CreateScheduleRequest) returns (CreateScheduleResponse) {
    option (google.api.http) = {
      post: "/v1/schedules"
      body: "*"
    };
  }

    // DeleteSchedule permanently removes a schedule.
    //
    // Effects:
    // - Schedule stops creating new messages
    // - Existing messages already posted remain in queue
    // - Schedule history is preserved
    //
    // Example:
    //   DELETE /v1/schedules/daily-sales-report
    //
    // Returns: success status
    // Errors:
    //   - NotFound: Schedule doesn't exist
  rpc DeleteSchedule(DeleteScheduleRequest) returns (DeleteScheduleResponse) {
    option (google.api.http) = {
      delete: "/v1/schedules/{schedule_id=*}"
    };
  }

    // GetSchedule retrieves schedule details and current state.
    //
    // Returns:
    // - Schedule configuration
    // - Current state (SCHEDULED, PAUSED, CANCELED, ERRORED)
    // - Next execution time
    // - Last execution time
    // - Execution count
    //
    // Example:
    //   GET /v1/schedules/daily-sales-report
    //
    // Returns: Schedule object
    // Errors:
    //   - NotFound: Schedule doesn't exist
  rpc GetSchedule(GetScheduleRequest) returns (GetScheduleResponse) {
    option (google.api.http) = {
      get: "/v1/schedules/{schedule_id=*}"
    };
  }

    // ListSchedules returns all schedules.
    //
    // Use for:
    // - Admin dashboards
    // - Monitoring active schedules
    // - Discovering schedules
    //
    // Example:
    //   GET /v1/schedules
    //
    // Returns: List of Schedule objects
  rpc ListSchedules(ListSchedulesRequest) returns (ListSchedulesResponse) {
    option (google.api.http) = {
      get: "/v1/schedules"
    };
  }

    // GetScheduleHistory returns execution history for a schedule.
    //
    // Shows:
    // - Past executions with timestamps
    // - Messages created by each execution
    // - Success/failure status
    //
    // Use for:
    // - Debugging missed executions
    // - Auditing schedule activity
    // - Verifying schedule correctness
    //
    // Example:
    //   GET /v1/schedules/daily-sales-report/history
    //
    // Returns: ScheduleHistory with execution records
  rpc GetScheduleHistory(GetScheduleHistoryRequest) returns (GetScheduleHistoryResponse) {
    option (google.api.http) = {
      get: "/v1/schedules/{schedule_id=*}/history"
    };
  }

    // PauseSchedule temporarily stops a schedule from creating messages.
    //
    // Use when:
    // - Temporarily disabling a feature
    // - During maintenance windows
    // - Debugging issues
    //
    // Effects:
    // - Schedule state → PAUSED
    // - No new messages created
    // - Can be resumed later with ResumeSchedule
    //
    // Example:
    //   POST /v1/schedules/daily-sales-report:pause
    //
    // Returns: success status
    // Errors:
    //   - NotFound: Schedule doesn't exist
    //   - FailedPrecondition: Schedule not in SCHEDULED state
  rpc PauseSchedule(PauseScheduleRequest) returns (PauseScheduleResponse) {
    option (google.api.http) = {
      post: "/v1/schedules/{schedule_id=*}:pause"
      body: "*"
    };
  }

    // ResumeSchedule reactivates a paused schedule.
    //
    // Effects:
    // - Schedule state → SCHEDULED
    // - Resets the max_messages execution counter
    // - Retains next_run; an overdue run is eligible immediately after resume
    // - Does NOT backfill missed executions during pause
    //
    // Example:
    //   POST /v1/schedules/daily-sales-report:resume
    //
    // Returns: success status
    // Errors:
    //   - NotFound: Schedule doesn't exist
    //   - FailedPrecondition: Schedule not in PAUSED state
  rpc ResumeSchedule(ResumeScheduleRequest) returns (ResumeScheduleResponse) {
    option (google.api.http) = {
      post: "/v1/schedules/{schedule_id=*}:resume"
      body: "*"
    };
  }

    // ==================== Dead Letter Queue Management ====================

    // GetDLQMessages retrieves messages from a dead letter queue.
    //
    // Dead letter queues contain:
    // - Messages that exhausted retry attempts
    // - Messages that caused persistent errors
    // - Messages rejected by workers
    //
    // Use for:
    // - Investigating failures
    // - Manual reprocessing after fixing bugs
    // - Identifying systematic issues
    //
    // Example:
    //   GET /v1/dlq/order-dlq/messages?page_size=50
    //
    // Returns: List of failed messages with error details
  rpc GetDLQMessages(GetDLQMessagesRequest) returns (GetDLQMessagesResponse) {
    option (google.api.http) = {
      get: "/v1/dlq/{dlq_name=*}/messages"
    };
  }

    // RequeueFromDLQ moves a message from DLQ to the required target queue.
    //
    // Use after:
    // - Fixing bugs that caused failures
    // - Resolving external service outages
    // - Correcting data issues
    //
    // Effects:
    // - Message removed from DLQ
    // - Message added to targetQueue as PENDING
    // - attempts_left always reset
    //
    // Example:
    //   POST /v1/dlq/order-dlq/messages/msg-123:requeue
    //   {
    //     "targetQueue": "orders"
    //   }
    //
    // Returns: success status
    // Errors:
    //   - NotFound: Message not in DLQ
    //   - NotFound: Target queue does not exist
    //   - InvalidArgument: targetQueue is empty
  rpc RequeueFromDLQ(RequeueFromDLQRequest) returns (RequeueFromDLQResponse) {
    option (google.api.http) = {
      post: "/v1/dlq/{dlq_name=*}/messages/{message_id=*}:requeue"
      body: "*"
    };
  }

    // DeleteFromDLQ permanently removes a message from the DLQ.
    //
    // Use when:
    // - Message is not recoverable
    // - Data is no longer relevant
    // - Cleaning up test data
    //
    // WARNING: This is permanent. Message cannot be recovered.
    //
    // Example:
    //   DELETE /v1/dlq/order-dlq/messages/msg-123
    //
    // Returns: success status
    // Errors:
    //   - NotFound: Message not in DLQ
  rpc DeleteFromDLQ(DeleteFromDLQRequest) returns (DeleteFromDLQResponse) {
    option (google.api.http) = {
      delete: "/v1/dlq/{dlq_name=*}/messages/{message_id=*}"
    };
  }

    // PurgeDLQ removes all messages from a dead letter queue.
    //
    // Use when:
    // - Cleaning up after incident
    // - Clearing test data
    // - DLQ too large to manage individually
    //
    // WARNING: This is irreversible. All DLQ messages are permanently deleted.
    //
    // Example:
    //   POST /v1/dlq/order-dlq:purge
    //
    // Returns: Whether the purge succeeded
  rpc PurgeDLQ(PurgeDLQRequest) returns (PurgeDLQResponse) {
    option (google.api.http) = {
      post: "/v1/dlq/{dlq_name=*}:purge"
      body: "*"
    };
  }

    // GetDLQStats returns statistics about a dead letter queue.
    //
    // Provides:
    // - Message count
    // - Queue creation and update timestamps
    //
    // Use for:
    // - Monitoring DLQ health
    // - Alerting on DLQ growth
    // - Identifying systemic issues
    //
    // Example:
    //   GET /v1/dlq/order-dlq/stats
    //
    // Returns: DLQ statistics
  rpc GetDLQStats(GetDLQStatsRequest) returns (GetDLQStatsResponse) {
    option (google.api.http) = {
      get: "/v1/dlq/{dlq_name=*}/stats"
    };
  }

    // ==================== Calendar Schedule Operations ====================

    // ValidateCalendarSchedule checks if a calendar schedule is valid.
    //
    // Validates:
    // - Calendar rule correctness
    // - Timezone validity
    // - Holiday rule logic
    //
    // Use before CreateSchedule to catch configuration errors.
    //
    // Example:
    //   POST /v1/calendar-schedules:validate
    //   {
    //     "calendar_schedule": {...}
    //   }
    //
    // Returns: Validation result with errors if invalid
  rpc ValidateCalendarSchedule(ValidateCalendarScheduleRequest) returns (ValidateCalendarScheduleResponse) {
    option (google.api.http) = {
      post: "/v1/calendar-schedules:validate"
      body: "*"
    };
  }

    // PreviewCalendarSchedule shows next N execution times for a schedule.
    //
    // Use to:
    // - Verify schedule behaves as expected
    // - Test complex calendar rules
    // - Confirm timezone handling
    // - Preview holiday exceptions
    //
    // Example:
    //   POST /v1/calendar-schedules:preview
    //   {
    //     "calendar_schedule": {...},
    //     "count": 10  // Next 10 executions
    //   }
    //
    //   Response:
    //   {
    //     "next_runs": [
    //       "2024-01-02T09:00:00Z",
    //       "2024-01-03T09:00:00Z",
    //       "2024-01-04T09:00:00Z",
    //       ...
    //     ]
    //   }
    //
    // Returns: List of upcoming execution timestamps
  rpc PreviewCalendarSchedule(PreviewCalendarScheduleRequest) returns (PreviewCalendarScheduleResponse) {
    option (google.api.http) = {
      post: "/v1/calendar-schedules:preview"
      body: "*"
    };
  }

    // ==================== Schema Management Operations ====================

    // RegisterSchema creates the next version of a message validation schema.
    //
    // Use for:
    // - Enforcing message structure
    // - API contract validation
    // - Data quality checks
    // - Type safety
    //
    // Schema versioning:
    // - Each schema has a schema_id and a server-assigned version number
    // - Multiple versions can coexist
    // - Queues reference schema_id (use highest active version)
    //
    // Example:
    //   POST /v1/schemas
    //   {
    //     "schema_id": "order-schema",
    //     "name": "Order schema",
    //     "content": "{...JSON Schema...}",
    //     "content_type": "json-schema"
    //   }
    //
    // Returns: Registered schema
    // Errors:
    //   - InvalidArgument: Invalid schema syntax
  rpc RegisterSchema(RegisterSchemaRequest) returns (RegisterSchemaResponse) {
    option (google.api.http) = {
      post: "/v1/schemas"
      body: "*"
    };
  }

    // GetSchema retrieves a specific schema version.
    //
    // Example:
    //   GET /v1/schemas/order-schema/versions/2
    //
    // Returns: Schema details
    // Errors:
    //   - NotFound: Schema not found
  rpc GetSchema(GetSchemaRequest) returns (GetSchemaResponse) {
    option (google.api.http) = {
      get: "/v1/schemas/{schema_id=*}/versions/{version=*}"
    };
  }

    // ListSchemas returns one summary for each registered schema family.
    //
    // Use for:
    // - Schema discovery
    // - Admin dashboards
    // - Schema management
    //
    // Example:
    //   GET /v1/schemas
    //
    // Returns: Latest matching version and aggregate version metadata for each family
  rpc ListSchemas(ListSchemasRequest) returns (ListSchemasResponse) {
    option (google.api.http) = {
      get: "/v1/schemas"
    };
  }

    // DeleteSchema deactivates a schema version, or all versions when version is 0.
    //
    // Effects:
    // - Matching active schema versions are marked inactive
    // - Inactive versions remain addressable for validation history
    //
    // Example:
    //   DELETE /v1/schemas/order-schema/versions/1
    //
    // Returns: Number of versions deactivated
    // Errors:
    //   - NotFound: Schema not found
  rpc DeleteSchema(DeleteSchemaRequest) returns (DeleteSchemaResponse) {
    option (google.api.http) = {
      delete: "/v1/schemas/{schema_id=*}/versions/{version=*}"
    };
  }

    // ValidatePayload validates a payload against a schema without posting a message.
    //
    // Use for:
    // - Pre-flight validation
    // - Testing schema changes
    // - Client-side validation
    // - Development/debugging
    //
    // Example:
    //   POST /v1/schemas/order-schema/versions/2:validate
    //   {
    //     "payload": {
    //       "data": "{\"orderId\": \"ORD-123\", ...}"
    //     }
    //   }
    //
    // Returns: ValidationResult (valid=true or list of errors)
  rpc ValidatePayload(ValidatePayloadRequest) returns (ValidatePayloadResponse) {
    option (google.api.http) = {
      post: "/v1/schemas/{schema_id=*}/versions/{version=*}:validate"
      body: "*"
    };
  }
}
