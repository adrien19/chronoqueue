
services:
  chronoqueuesvc:
    container_name: chronoqueue-server
    hostname: chronoqueue-server
    build:
      context: ..
      dockerfile: ./images/Dockerfile.sqlite
    environment:
      - SERVER_MODE=development
      - STORAGE_TYPE=sqlite
      - SQLITE_DB_PATH=/data/chronoqueue.db
      - GRPC_ADDR=:9000
      - HTTP_ADDR=:8080
      - CHRONOQUEUE_TLS_ENABLED=false
      - ENABLE_ENCRYPTION=true
      - ENCRYPTION_KEY_SOURCE_TYPE=LOCAL
      - ENCRYPTION_KEY=0123456789abcdef0123456789abcdef
      - LOG_LEVEL=debug
      - LOG_FORMAT=text
      - ENABLE_API_DOCS=true
      - API_DOCS_CORS_ORIGINS=*
    networks:
      - chronoqueue-network
    volumes:
      - ${WORKSPACE_FOLDER}/certs:/secrets
      - sqlite-data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  chronoqueue-ui:
    container_name: chronoqueue-ui
    hostname: chronoqueue-ui
    build:
      context: ..
      dockerfile: ./images/Dockerfile.sqlite
    entrypoint: ["/chronoqueue"]
    environment:
      - CHRONOQUEUE_UI_AUTH_ENABLED=true
      - CHRONOQUEUE_UI_AUTH_USERNAME=${CHRONOQUEUE_UI_AUTH_USERNAME:?Set CHRONOQUEUE_UI_AUTH_USERNAME}
      - CHRONOQUEUE_UI_AUTH_PASSWORD=${CHRONOQUEUE_UI_AUTH_PASSWORD:?Set CHRONOQUEUE_UI_AUTH_PASSWORD}
      - CHRONOQUEUE_UI_TLS_CERT_FILE=/secrets/server.crt
      - CHRONOQUEUE_UI_TLS_KEY_FILE=/secrets/server.key
      - CHRONOQUEUE_UI_PUBLIC_ORIGIN=https://localhost:8081
    command:
      - web-ui
      - start
      - --host
      - 0.0.0.0
      - --port
      - "8081"
      - --grpc-address
      - chronoqueuesvc:9000
      - --skip-ssl
    depends_on:
      - chronoqueuesvc
    networks:
      - chronoqueue-network
    volumes:
      - ${WORKSPACE_FOLDER}/certs:/secrets:ro
    ports:
      - "127.0.0.1:8081:8081"
    restart: unless-stopped

networks:
  chronoqueue-network:
    driver: bridge

volumes:
  sqlite-data:
    driver: local
